<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'" />
  <title>Agy HUD</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="shell">
    <header class="header">
      <div class="header-left">
        <h1 class="title">Agy HUD</h1>
        <span id="app-version" class="app-version tabular-nums" title="当前插件运行版本" data-i18n-title="version.title">__PLUGIN_VERSION__</span>
        <span id="live-pill" class="live-pill" role="status" title="等待会话数据" data-i18n-title="live.waitingTitle">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-label" data-i18n="live.connecting">连接中</span>
        </span>
      </div>
      <div class="header-right">
        <nav class="tabs" role="tablist" aria-label="视图切换" data-i18n-aria="tabs.aria">
          <button id="tab-overview" type="button" role="tab" aria-selected="true" class="tab active" data-i18n="tab.overview">总览</button>
          <button id="tab-trend" type="button" role="tab" aria-selected="false" class="tab" data-i18n="tab.trend">趋势</button>
          <button id="tab-usage" type="button" role="tab" aria-selected="false" class="tab" data-i18n="tab.usage">用量</button>
        </nav>
        <button id="lang-toggle" type="button" class="lang-btn" title="Switch to English" data-i18n="lang.toggle" data-i18n-title="lang.toggleTitle">EN</button>
      </div>
    </header>

    <div id="state-banner" class="state-banner hidden"></div>

    <main id="view-overview" class="view">
      <!-- 1. 配额（5h / 周窗口 · 剩余/已用切换） -->
      <section class="section">
        <div class="section-head">
          <div class="section-title-group">
            <span class="section-title" data-i18n="quota.title">配额</span>
            <span class="section-note" data-i18n="quota.note">5h / 周</span>
            <button id="quota-refresh" type="button" class="icon-btn" title="手动刷新配额" aria-label="手动刷新配额" data-i18n-title="quota.refreshTitle" data-i18n-aria="quota.refreshTitle"><span>↻</span></button>
          </div>
          <div class="seg-group" role="group" aria-label="配额展示方式" data-i18n-aria="quota.modeAria">
            <button data-qmode="remaining" type="button" class="seg-btn qmode-btn active" data-i18n="quota.remaining">剩余</button>
            <button data-qmode="used" type="button" class="seg-btn qmode-btn" data-i18n="quota.used">已用</button>
          </div>
        </div>
        <div id="quota-card" class="context-card quota-card" title="点击切换 剩余 / 已用" data-i18n-title="quota.cardTitle">
          <div class="section-note" data-i18n="quota.loading">读取中…</div>
        </div>
      </section>

      <!-- 2. 速度（按模型） -->
      <section class="section">
        <div class="section-head">
          <div class="section-title-group">
            <span class="section-title" title="按模型统计本会话纯生成速度（已扣 TTFT）" data-i18n="speed.title" data-i18n-title="speed.titleTip">速度</span>
            <span class="section-note">tok/s</span>
          </div>
          <button id="scope-toggle" type="button" class="scope-btn hidden" title="切换统计全部会话或仅当前选中的代理" data-i18n-title="speed.scopeTip">全部</button>
        </div>
        <div id="model-list" class="model-list">
          <div class="empty-card" data-i18n="quota.loading">读取中…</div>
        </div>
      </section>

      <!-- 3. 上下文 -->
      <section class="section">
        <div class="section-head">
          <span class="section-title" data-i18n="ctx.title">上下文</span>
          <span id="session-summary" class="section-note tabular-nums"></span>
        </div>

        <div id="main-card" class="context-card main-card" role="button" tabindex="0" title="点击返回主会话" data-i18n-title="ctx.mainCardTitle">
          <div class="card-top">
            <div class="card-left">
              <span class="agent-name" data-i18n="ctx.main">主会话</span>
              <span id="main-model" class="badge-muted">—</span>
            </div>
            <span id="main-ratio" class="ratio tabular-nums">— / —</span>
          </div>
          <div id="main-progress-track" class="progress-track">
            <div id="main-bar-cache" class="progress-seg" style="width: 0%;"></div>
            <div id="main-bar-fresh" class="progress-seg progress-fresh" style="width: 0%;"></div>
            <div id="main-bar-est" class="progress-seg progress-est" style="width: 0%;"></div>
          </div>
          <div class="card-sub tabular-nums">
            <span id="main-split">—</span>
            <span id="main-think" class="think-note" data-i18n="ctx.thinkEmpty">思考占输出 —</span>
          </div>
          <div id="cache-ttl-row" class="cache-ttl-row tabular-nums">
            <span class="cache-ttl-left">
              <span id="cache-ttl-dot" class="cache-ttl-dot"></span>
              <span id="cache-ttl-text" data-i18n="ctx.cacheNone">缓存 —</span>
            </span>
            <span id="main-remaining" class="cache-ttl-right">—</span>
          </div>
        </div>

        <div id="sub-section" class="sub-section hidden">
          <div id="sub-active-wrap" class="sub-group hidden">
            <div class="sub-head">
              <span data-i18n="ctx.activeSubs">活跃子代理</span>
              <span id="sub-count" class="tabular-nums">0</span>
            </div>
            <div id="sub-list" class="sub-list"></div>
          </div>
          <div id="sub-idle-wrap" class="sub-group hidden">
            <button id="sub-idle-toggle" type="button" class="sub-idle-toggle" aria-expanded="false">
              <span id="sub-idle-caret" class="sub-idle-caret" aria-hidden="true">▸</span>
              <span id="sub-idle-label">已完成 0 个子代理</span>
            </button>
            <div id="sub-idle-list" class="sub-list hidden"></div>
          </div>
        </div>

        <div id="focus-bar" class="focus-bar hidden">
          <span><span data-i18n="ctx.viewing">查看：</span><strong id="focus-name">主会话</strong></span>
          <div class="focus-actions">
            <button id="focus-trend" type="button" class="scope-btn" data-i18n="ctx.viewTrend">看趋势 →</button>
            <button id="focus-reset" type="button" class="scope-btn" data-i18n="ctx.backToMain">返回主会话</button>
          </div>
        </div>
      </section>
    </main>

    <main id="view-trend" class="view hidden">
      <div id="trend-focus-bar" class="trend-focus-bar hidden">
        <div class="trend-focus-left">
          <span data-i18n="ctx.viewing">查看：</span>
          <strong id="trend-focus-label">主会话</strong>
        </div>
        <button id="trend-reset-focus" type="button" class="scope-btn" data-i18n="ctx.backToMain">返回主会话</button>
      </div>

      <section class="context-card">
        <div class="card-top">
          <span class="agent-name" data-i18n="trend.curveTitle">上下文曲线</span>
          <span class="section-note" data-i18n="trend.warnLine">75% 警戒线</span>
        </div>
        <svg id="trend-chart" viewBox="0 0 380 116" class="trend-svg" aria-label="上下文增长曲线" data-i18n-aria="trend.curveAria"></svg>
        <div id="trend-readout" class="trend-readout tabular-nums">—</div>
      </section>

      <section id="breakdown-card" class="context-card hidden">
        <div class="card-top">
          <span class="agent-name" data-i18n="trend.breakdownTitle">占用构成</span>
          <span id="breakdown-total" class="section-note tabular-nums"></span>
        </div>
        <div id="breakdown-list" class="breakdown-list"></div>
      </section>

      <section class="table-card">
        <div class="table-head">
          <span>#</span>
          <span data-i18n="trend.colModel">模型</span>
          <span class="text-right" data-i18n="trend.colContext">上下文</span>
          <span class="text-right" data-i18n="trend.colTtft">首字</span>
          <span class="text-right" data-i18n="trend.colSpeed">速度</span>
        </div>
        <div id="trend-rows" class="table-body tabular-nums"></div>
      </section>
    </main>

    <main id="view-usage" class="view hidden">
      <!-- 用量（本会话 / Antigravity 桌面端 · 合并缓存命中率 · 美元折算） -->
      <section class="section">
        <div class="section-head usage-head">
          <div class="usage-top-bar" style="width: 100%;">
            <div class="section-title-group">
              <span class="section-title" data-i18n="usage.title">用量</span>
              <div class="seg-group" role="group" aria-label="统计范围" data-i18n-aria="usage.scopeAria">
                <button data-uscope="session" type="button" class="seg-btn uscope-btn" data-i18n="usage.scopeSession">本会话</button>
                <button data-uscope="all" type="button" class="seg-btn uscope-btn active" data-i18n="usage.scopeAll">全部</button>
              </div>
              <div class="seg-group" role="group" aria-label="用量单位" data-i18n-aria="usage.modeAria">
                <button data-umode="usd" type="button" class="seg-btn umode-btn" data-i18n="usage.modeUsd">USD</button>
                <button data-umode="all" type="button" class="seg-btn umode-btn active" data-i18n="usage.modeAll">含缓存</button>
                <button data-umode="net" type="button" class="seg-btn umode-btn" data-i18n="usage.modeNet">净消耗</button>
              </div>
            </div>
            <div class="usage-controls">
              <div id="usage-range-group" class="seg-group" role="group" aria-label="统计周期" data-i18n-aria="usage.rangeAria">
                <button data-urange="today" type="button" class="seg-btn urange-btn active" data-i18n="usage.rangeToday">今日</button>
                <button data-urange="7d" type="button" class="seg-btn urange-btn" data-i18n="usage.range7d">7天</button>
                <button data-urange="30d" type="button" class="seg-btn urange-btn" data-i18n="usage.range30d">30天</button>
              </div>
              <span id="usage-session-note" class="section-note hidden"></span>
            </div>
          </div>
        </div>

        <div id="usage-card" class="context-card usage-card">
          <div class="usage-hero">
            <div class="usage-hero-left">
              <span id="usage-hero-primary" class="usage-hero-num tabular-nums">—</span>
              <span id="usage-hero-unit" class="section-note">tokens</span>
            </div>
            <span id="usage-hero-meta" class="section-note tabular-nums">—</span>
          </div>

          <div class="usage-stats tabular-nums">
            <div class="usage-stat">
              <div class="usage-stat-top">
                <span data-i18n="usage.input">输入</span>
                <span id="usage-sub-in">—</span>
              </div>
              <div id="usage-main-in" class="usage-stat-val">—</div>
            </div>
            <div class="usage-stat">
              <div class="usage-stat-top">
                <span data-i18n="usage.cache">缓存</span>
                <span id="usage-sub-cache">—</span>
              </div>
              <div id="usage-main-cache" class="usage-stat-val">—</div>
            </div>
            <div class="usage-stat">
              <div class="usage-stat-top">
                <span data-i18n="usage.output">输出</span>
                <span id="usage-sub-out">—</span>
              </div>
              <div id="usage-main-out" class="usage-stat-val">—</div>
            </div>
          </div>

          <div id="session-split" class="session-split hidden">
            <div class="session-split-bar">
              <div id="session-split-main-bar" class="session-split-main" style="width: 100%;"></div>
              <div id="session-split-subs-bar" class="session-split-subs" style="width: 0%;"></div>
            </div>
            <div class="session-split-legend tabular-nums">
              <span class="session-split-item">
                <span class="session-split-dot main"></span>
                <span id="session-split-main-text">—</span>
              </span>
              <span class="session-split-item">
                <span class="session-split-dot subs"></span>
                <span id="session-split-subs-text">—</span>
              </span>
            </div>
          </div>

          <div id="usage-chart-wrap" class="usage-chart-wrap">
            <div id="usage-bars" class="usage-bars"></div>
            <div id="usage-axis" class="usage-axis tabular-nums"></div>
            <div id="usage-readout" class="usage-readout tabular-nums">—</div>
          </div>

          <div id="usage-models" class="usage-models"></div>
          <div id="usage-footer" class="usage-footer tabular-nums hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
